<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>像素露营地 · One More Night Outside</title>
  <link rel="stylesheet" href="scene.css">
  <script src="wallpaper-runtime.js" defer></script>
  <script src="scene.js" defer></script>
</head>
<body>
  <canvas id="scene" aria-label="像素松林中的帐篷、篝火、溪流与萤火虫，天空缓慢变换昼夜"></canvas>
  <div data-scene-controls class="hud">
    <div><strong>像素露营地</strong><small>ONE MORE NIGHT OUTSIDE</small></div>
    <button id="daylight" type="button">换个时刻</button>
    <button id="pause" type="button">暂停</button>
    <span data-keyboard>D 时刻 · 空格 暂停<span data-fullscreen> · F 全屏</span></span>
  </div>
</body>
</html>
