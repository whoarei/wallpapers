<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>矩阵回声 · Matrix Echo</title>
  <link rel="stylesheet" href="matrix.css">
  <script src="wallpaper-runtime.js" defer></script>
  <script src="matrix.js" defer></script>
</head>
<body>
  <canvas id="matrix" aria-label="绿色代码雨在黑暗中流淌，通向一道发光的门；点击画面泛起数据涟漪"></canvas>
  <header class="identity"><span class="mark" aria-hidden="true">Ⅲ</span><div><h1>矩阵回声</h1><p>M A T R I X &nbsp; E C H O</p></div></header>
  <div class="signature" aria-hidden="true"><span class="signal"></span> THE CONSTRUCT <span class="separator">/</span> FOLLOW THE WHITE RABBIT</div>
  <footer class="hud" data-scene-controls>
    <span class="hint">点击 · 扰动矩阵<span data-keyboard> / 空格 · 暂停</span></span>
    <div class="controls">
      <button id="speed" type="button">流速 · 缓慢</button>
      <button id="light" type="button">辉光 · 标准</button>
      <button id="pause" type="button" aria-pressed="false">暂停</button>
      <button id="fullscreen" type="button" data-fullscreen>全屏</button>
    </div>
  </footer>
</body>
</html>
