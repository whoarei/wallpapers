<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>云端浮岛 · A Little Closer to the Sky</title>
  <link rel="stylesheet" href="scene.css">
  <script src="wallpaper-runtime.js" defer></script>
  <script src="scene.js" defer></script>
</head>
<body>
  <canvas id="scene" aria-label="云海中的花园浮岛、流动瀑布和缓缓飞过的飞艇"></canvas>
  <div data-scene-controls class="hud">
    <div><strong>云端浮岛</strong><small>A LITTLE CLOSER TO THE SKY</small></div>
    <button id="light" type="button">日落光线</button>
    <button id="pause" type="button">暂停</button>
    <span data-keyboard>L 光线 · 空格 暂停<span data-fullscreen> · F 全屏</span></span>
  </div>
</body>
</html>
