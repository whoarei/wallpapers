<script>
(()=>{
'use strict';
const canvas=document.getElementById('world'), ctx=canvas.getContext('2d',{alpha:false});
const W=960,H=600;

function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}

const rect=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
function poly(c,pts,col){c.fillStyle=col;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(Math.round(p[0]),Math.round(p[1])):c.moveTo(Math.round(p[0]),Math.round(p[1])));c.closePath();c.fill();}

 rect(c,doorX-2,y+h-25,14,25,'#b18b58');rect(c,doorX,y+h-23,10,23,'#725d44');rect(c,doorX+2,y+h-21,6,9,'#d3c58c');rect(c,doorX+7,y+h-9,1,2,'#efd080');rect(c,doorX-5,y+h,20,3,'#d7bf8b');rect(c,doorX-8,y+h+3,26,3,'#c2aa7c');

 if(type==='home'){rect(c,x+6,y+h-3,13,4,'#956a48');for(let q=0;q<4;q++)flower(c,x+7+q*3,y+h-5,pick(['#e7a58a','#f4cf76','#f0dda1']));}

}

 for(let i=0;i<700;i++){const x=rnd(0,765),y=rnd(226,465);const p=lc.getImageData(Math.floor(x),Math.floor(y),1,1).data;if(p[0]>190&&p[1]>170)rect(lc,x,y,rnd(1,4),1,pick(['#c2ae80','#dfcfa6','#bca678']));}

 // Farm field and vegetable rows.

 for(let y=272;y<322;y+=9){rect(lc,77,y,97,2,'#866e45');for(let x=79;x<173;x+=9){rect(lc,x,y-3,4,3,'#708748');rect(lc,x+1,y-5,2,5,'#9ca65a');rect(lc,x+3,y-2,2,3,'#d3b65b');}}

 house(lc,397,243,76,53,'#8a7771','#e6d5a4');

 house(lc,201,403,73,54,'#7c8c70','#e4c999');

 // Railway bed, ties, and steel rails.
 rect(lc,0,493,W,23,'#a89b7a');for(let x=0;x<W;x+=11){rect(lc,x,495,5,19,'#786d53');rect(lc,x,496,5,2,'#928267');}rect(lc,0,499,W,2,'#ded4ae');rect(lc,0,510,W,2,'#ded4ae');rect(lc,0,501,W,1,'#686d5c');rect(lc,0,512,W,1,'#686d5c');

 // Station and platform.
 rect(lc,62,472,265,17,'#c2b58c');rect(lc,60,484,268,6,'#e3d3a6');rect(lc,64,489,264,3,'#8f8263');
 house(lc,98,425,79,49,'#9f6c4c','#e2cd9c','station');
 rect(lc,189,449,92,4,'#a67c51');rect(lc,192,453,4,27,'#9b8055');rect(lc,274,453,4,27,'#9b8055');poly(lc,[[183,449],[196,437],[278,437],[290,449]],'#7c8a70');

 for(const [x,y] of [[281,444],[391,448],[671,440],[195,290]]){rect(lc,x,y-9,10,13,'#a78250');rect(lc,x,y-7,10,2,'#795f3d');rect(lc,x,y,10,2,'#795f3d');rect(lc,x+2,y-9,6,1,'#c8a16a');}

 for(const [x,y] of [[752,290],[843,411],[793,567],[720,465],[901,476],[52,532]]){rect(dc,x,y,10,4,'#a8aa82');rect(dc,x+2,y-2,6,3,'#c1be96');}
}
buildWorld();
const villagers=Array.from({length:18},(_,i)=>({x:rnd(40,720),y:pick([354,359,365,339]),speed:rnd(3,8)*(i%2?1:-1),shirt:pick(['#ad6354','#73908c','#d8b76f','#687a9c','#c28c79','#8d9c60']),hair:pick(['#5b4839','#a78352','#dbcc9c','#764f36']),pause:rnd(0,40),lane:i%4}));
const clouds=Array.from({length:11},()=>({x:rnd(-120,960),y:rnd(30,137),s:rnd(.6,1.9),v:rnd(.3,1.3)}));
const stars=Array.from({length:85},()=>({x:rnd(0,960),y:rnd(3,173),s:random(),p:rnd(0,7)}));
const waterLines=Array.from({length:85},()=>({y:rnd(211,600),off:rnd(-24,24),w:rnd(3,13),p:rnd(0,10)}));
function mix(a,b,f){return a.map((v,i)=>Math.round(v+(b[i]-v)*f));}
const rgb=a=>`rgb(${a.join(',')})`;
function sky(t){
 const cycle=(t/480+.30)%1;
 if(phaseMode===1){night=0;sunset=0;}else if(phaseMode===2){night=.06;sunset=1;}else if(phaseMode===3){night=1;sunset=0;}else{night=(Math.cos((cycle-.82)*Math.PI*2)+1)/2;night=Math.max(0,Math.min(1,(night-.34)/.66));sunset=Math.max(0,1-Math.abs(cycle-.55)/.17)*(1-night);}
 const top=mix(mix([126,170,164],[211,151,125],sunset),[28,46,67],night),bot=mix(mix([221,218,167],[240,190,139],sunset),[91,104,105],night);
 const g=ctx.createLinearGradient(0,0,0,220);g.addColorStop(0,rgb(top));g.addColorStop(1,rgb(bot));ctx.fillStyle=g;ctx.fillRect(0,0,W,220);
 if(night>.25){ctx.globalAlpha=(night-.25)/.75;stars.forEach(s=>{rect(ctx,s.x,s.y,s.s>.85?2:1,1,`rgba(245,232,186,${.4+.45*Math.sin(t*.6+s.p)**2})`);});ctx.globalAlpha=1;}
 // Sun and moon, built as stepped pixels.
 const sx=739,sy=84+sunset*35;
 ctx.globalAlpha=(1-night)*.8;rect(ctx,sx-12,sy-20,24,40,'#f2dca3');rect(ctx,sx-18,sy-14,36,28,'#f2dca3');rect(ctx,sx-20,sy-8,40,16,'#f2dca3');ctx.globalAlpha=night;
 rect(ctx,742,43,16,26,'#e8dfb0');rect(ctx,737,48,25,16,'#e8dfb0');rect(ctx,749,41,15,19,rgb(top));ctx.globalAlpha=1;
 for(const cl of clouds){const x=((cl.x+t*cl.v+150)%1260)-150;ctx.globalAlpha=(1-night*.4)*.43;ctx.save();ctx.translate(Math.round(x),cl.y);ctx.scale(cl.s,cl.s);rect(ctx,0,0,47,7,'#f1e5bd');rect(ctx,7,-6,31,13,'#f1e5bd');rect(ctx,14,-11,16,7,'#f1e5bd');rect(ctx,36,2,13,4,'#f1e5bd');ctx.restore();}ctx.globalAlpha=1;
 // Distant mountains, foothills and a misty pine forest.
 poly(ctx,[[0,174],[0,134],[42,130],[88,98],[114,115],[159,77],[214,125],[255,100],[313,147],[359,129],[404,161],[457,130],[506,161],[559,129],[619,165],[674,127],[733,156],[782,113],[833,145],[887,105],[942,145],[960,138],[960,220]],rgb(mix([116,151,135],[43,69,77],night)));
 poly(ctx,[[119,117],[159,77],[194,110],[174,101],[164,106],[153,98],[145,111],[138,108]],rgb(mix([204,207,169],[106,130,133],night)));
 poly(ctx,[[0,183],[0,157],[56,148],[114,172],[176,141],[242,165],[292,146],[367,176],[440,150],[511,173],[568,152],[626,169],[695,150],[760,174],[826,156],[903,171],[960,149],[960,220]],rgb(mix([103,139,107],[43,74,75],night)));
 for(let x=0;x<970;x+=12){const y=186+Math.sin(x*.05)*5;poly(ctx,[[x-9,y+13],[x,y-20-(x%19)],[x+9,y+13]],rgb(mix([77,119,91],[34,67,66],night)));}
}
function person(v,t){const walk=Math.sin(t*7+v.x)>.0?1:0;const x=Math.round(v.x),y=Math.round(v.y);rect(ctx,x-3,y,7,2,'#4d62443f');rect(ctx,x-2,y-4,2,4+walk,'#5d5a4a');rect(ctx,x+1,y-4,2,5-walk,'#5d5a4a');rect(ctx,x-3,y-10,6,7,v.shirt);rect(ctx,x-2,y-14,5,5,'#e6c598');rect(ctx,x-3,y-15,6,3,v.hair);rect(ctx,x+(v.speed>0?2:-2),y-11,1,1,'#574b3d');rect(ctx,x-4,y-9+walk,1,4,'#e2ba89');rect(ctx,x+3,y-9-walk,1,4,'#e2ba89');}
function cat(x,y,t){rect(ctx,x-5,y,12,2,'#596a4344');rect(ctx,x-4,y-5,10,5,'#c99258');rect(ctx,x+3,y-9,5,5,'#d8a569');rect(ctx,x+3,y-11,2,3,'#d8a569');rect(ctx,x+7,y-11,1,3,'#d8a569');rect(ctx,x+7,y-7,1,1,'#5e5141');rect(ctx,x-7,y-6-Math.round(Math.sin(t)*1),4,2,'#c99258');}
function duck(x,y,t){rect(ctx,x-4,y,10,3,'#e7d2a0');rect(ctx,x+2,y-4,4,5,'#eee1b5');rect(ctx,x+6,y-2,3,2,'#d5a16c');rect(ctx,x+4,y-3,1,1,'#535a48');rect(ctx,x-8,y+5,15,1,'#bad0b12c');}
function drawTrain(){
 const age=t-trainStart;if(age<0||age>72)return;
 // 20 seconds entering, 15 seconds at the station, then departure.
 let x;if(age<20)x=-285+age*23.25;else if(age<35)x=180;else x=180+(age-35)*37;
 const y=493;
 for(let k=2;k>=0;k--){const xx=x-k*61;rect(ctx,xx-2,y-2,59,6,'#4b5546');rect(ctx,xx,y-24,54,25,k===0?'#527f70':'#bd9d69');rect(ctx,xx-2,y-26,58,4,'#4c5c4c');rect(ctx,xx+1,y-7,52,4,'#e4ca94');rect(ctx,xx+3,y-22,49,1,'#94ad84');for(let wx=6;wx<47;wx+=13){rect(ctx,xx+wx,y-20,9,10,night>.4?'#f4cf81':'#acc5ad');rect(ctx,xx+wx,y-10,9,2,'#627c66');}for(const wx of [8,39]){rect(ctx,xx+wx,y+3,8,5,'#414a40');rect(ctx,xx+wx+2,y+4,4,2,'#9e9d80');}rect(ctx,xx+55,y-1,6,2,'#514f40');}
 rect(ctx,x+39,y-34,11,10,'#4d6555');rect(ctx,x+38,y-36,14,3,'#d3b17a');rect(ctx,x+47,y-29,2,5,'#cfae75');rect(ctx,x+52,y-12,3,4,'#f0d597');
 for(let i=0;i<5;i++){const a=(t*.32+i*.22)%1,px=x+44-a*29,py=y-39-a*29;ctx.globalAlpha=(1-a)*.45;rect(ctx,px,py,5+a*8,4+a*6,'#e1dbc1');ctx.globalAlpha=1;}
}
function drawLights(){
 buildings.forEach((b,i)=>{const lit=manualLights.has(i)||night>.27;if(!lit)return;const a=manualLights.has(i)?1:Math.min(1,(night-.27)*2.4);ctx.globalAlpha=a;
 for(const wi of b.windows){rect(ctx,wi.x,wi.y,wi.w,wi.h,'#eac57a');rect(ctx,wi.x+2,wi.y+2,3,4,'#ffe0a0');rect(ctx,wi.x+5,wi.y,2,12,'#b28d57');rect(ctx,wi.x,wi.y+6,12,2,'#b28d57');ctx.globalAlpha=a*.08;rect(ctx,wi.x-8,wi.y-6,28,26,'#ffe8a5');ctx.globalAlpha=a;}
 ctx.globalAlpha=a*.2;poly(ctx,[[b.x+b.w/2-5,b.y+b.h],[b.x+b.w/2+7,b.y+b.h],[b.x+b.w/2+20,b.y+b.h+22],[b.x+b.w/2-14,b.y+b.h+22]],'#ffe3a1');ctx.globalAlpha=1;});
 for(const [x,y] of [[324,357],[514,351],[691,368],[76,479],[330,480]]){rect(ctx,x,y-24,2,24,'#786c4d');rect(ctx,x-3,y-25,8,2,'#9b895b');rect(ctx,x-2,y-22,6,7,night>.3?'#f6d797':'#d9cf9c');rect(ctx,x,y-25,2,10,'#a49367');if(night>.3){ctx.globalAlpha=night*.16;rect(ctx,x-10,y-27,22,20,'#ffdda1');poly(ctx,[[x,y-15],[x-15,y+3],[x+17,y+3]],'#ffdfa4');ctx.globalAlpha=1;}}
}
function windmill(){ctx.save();ctx.translate(879,218);ctx.rotate(t*.16);for(let a=0;a<4;a++){ctx.save();ctx.rotate(a*Math.PI/2);rect(ctx,-2,-31,3,33,'#8d7454');rect(ctx,1,-30,8,22,'#e5d4a3');for(let y=-29;y<-8;y+=5)rect(ctx,1,y,8,1,'#9b8d62');rect(ctx,5,-30,1,22,'#ae9a6e');ctx.restore();}rect(ctx,-3,-3,6,6,'#765f46');rect(ctx,-1,-1,2,2,'#ead5a0');ctx.restore();}
function ambient(){
 for(const b of [buildings[0],buildings[2],buildings[4]])for(let i=0;i<3;i++){const a=(t*.035+i*.33)%1;ctx.globalAlpha=(1-a)*.28;rect(ctx,b.x+b.w-16+Math.sin(t*.25+i)*4+a*16,b.y-43-a*26,4+a*8,3+a*5,'#eee6c7');ctx.globalAlpha=1;}
 // Fountain spray, river glints and swimming ducks.
 for(let i=0;i<6;i++){const a=(t*.7+i/6)%1;rect(ctx,460+Math.sin(i*2.4)*a*13,298+a*a*22,1,2,'#c0d7bd');}
 for(const l of waterLines){const y=(l.y+t*1.4)%390+211;const x=riverX(y)+l.off+Math.sin(t*.7+l.p)*3;ctx.globalAlpha=.23+.16*Math.sin(t+l.p);rect(ctx,x,y,l.w,1,'#d7e3bb');ctx.globalAlpha=1;}
 duck(riverX(412)+Math.sin(t*.08)*15,412+Math.sin(t*.11)*13,t);duck(riverX(540)+8+Math.sin(t*.1)*17,540+Math.sin(t*.12)*9,t);
 cat(293+Math.sin(t*.1)*3,384,t);cat(683,414,t+3);
 // Birds drift in small flocks.
 for(let i=0;i<5;i++){const x=(t*5.3+i*15+190)%1120-80,y=91+Math.sin(t*.18+i*.3)*6+i%3*5;rect(ctx,x,y,2,1,'#5a776a');rect(ctx,x-2,y+(Math.sin(t*6+i)>0?-1:1),2,1,'#5a776a');rect(ctx,x+2,y+(Math.sin(t*6+i)>0?-1:1),2,1,'#5a776a');}
 // Laundry moves lightly in the wind.
 rect(ctx,344,411,1,21,'#8f7752');rect(ctx,388,411,1,21,'#8f7752');rect(ctx,344,411,45,1,'#b9b28a');for(let i=0;i<4;i++){const xx=351+i*9+Math.sin(t*1.2+i)*.8;rect(ctx,xx,412,6,9,pickStable(i));}
 if(night>.45&&!raining){for(let i=0;i<24;i++){const x=65+((i*103)%650)+Math.sin(t*.25+i)*8,y=400+((i*31)%155)+Math.cos(t*.33+i)*8;ctx.globalAlpha=night*(.25+.65*Math.sin(t*1.1+i)**4);rect(ctx,x,y,1,2,'#e9e5a0');ctx.globalAlpha=1;}}
 // Butterflies above the flowerbeds.
 if(night<.5&&!raining)for(let i=0;i<6;i++){const x=150+i*89+Math.sin(t*.7+i)*10,y=380+Math.cos(t*.55+i)*11;rect(ctx,x,y,1,3,'#7c7956');rect(ctx,x+(Math.sin(t*10)>0?-2:1),y,2,2,i%2?'#edd399':'#e4aa89');}
}
function pickStable(i){return ['#efdfb8','#a7b4a0','#cc9e8c','#d9c38b'][i%4];}
function drawRain(){if(!raining)return;rect(ctx,0,0,W,H,'#33546621');for(let i=0;i<165;i++){const x=((i*73+t*39)%1030)-35,y=(i*47+t*170)%660-40;rect(ctx,x,y,1,5,'#d1e0ca65');rect(ctx,x-1,y+5,1,3,'#d1e0ca45');}for(let i=0;i<30;i++){const x=(i*127)%960,y=330+(i*37)%240;if(inWater(x,y)||i%3===0){const a=(t*1.5+i*.13)%1;ctx.globalAlpha=(1-a)*.35;rect(ctx,x-a*4,y,2+a*8,1,'#d5e0c2');ctx.globalAlpha=1;}}}
function render(){
 ctx.imageSmoothingEnabled=false;sky(t);ctx.drawImage(land,0,0);
 ambient();windmill();
 for(const v of [...villagers].sort((a,b)=>a.y-b.y))person(v,t);
 drawTrain();ctx.drawImage(details,0,0);
 flowers.forEach(f=>flower(ctx,f.x,f.y,f.col));
 // A shared tint keeps the whole town in the same changing light.
 if(sunset>.02)rect(ctx,0,174,W,H-174,`rgba(198,111,75,${sunset*.16})`);
 if(night>.01)rect(ctx,0,174,W,H-174,`rgba(15,35,57,${night*.65})`);
 drawLights();drawRain();
 for(let i=particles.length-1;i>=0;i--){const p=particles[i],age=t-p.born;if(age>2){particles.splice(i,1);continue;}ctx.globalAlpha=1-age/2;rect(ctx,p.x+Math.sin(age*3+p.x)*3,p.y-age*13,2,2,p.col);ctx.globalAlpha=1;}
 // Fine edge shading, without softening the pixels.
 const vg=ctx.createRadialGradient(480,270,190,480,270,640);vg.addColorStop(0,'#132c2200');vg.addColorStop(1,'#102d2435');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function update(dt){t+=dt;for(const v of villagers){if(Math.sin(t*.05+v.pause)>.82)continue;v.x+=v.speed*dt;if(v.x>728){v.x=728;v.speed=-Math.abs(v.speed);}if(v.x<33){v.x=33;v.speed=Math.abs(v.speed);}}
 if(t-trainStart>105)trainStart=t;
}
function frame(now){const dt=Math.min((now-last)/1000,.1);if(now-last>=1000/30){last=now;if(!paused)update(dt);render();}if(now-idleAt>8500&&!document.getElementById('helpPanel').classList.contains('open'))document.body.classList.add('idle');if(toastAt&&now-toastAt>3100){document.getElementById('toast').classList.remove('show');toastAt=0;}requestAnimationFrame(frame);}
function toast(msg){document.getElementById('toast').textContent=msg;document.getElementById('toast').classList.add('show');toastAt=performance.now();}
function wake(){idleAt=performance.now();document.body.classList.remove('idle');}
function clock(){const d=new Date();document.getElementById('time').textContent=d.toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('date').textContent=d.toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'short'});document.getElementById('status').textContent=`18 位居民 · 林间铁路 · ${raining?'雨':'晴'}`;}
function phase(){phaseMode=(phaseMode+1)%4;document.getElementById('phaseLabel').textContent=['流动时光','晴朗白昼','温柔黄昏','星光夜晚'][phaseMode];toast(['时光开始慢慢流动。','把阳光留在小镇。','夕阳把屋顶染成了蜂蜜色。','今晚，星星和灯火一起值班。'][phaseMode]);render();}
function weather(){raining=!raining;document.getElementById('weatherIcon').textContent=raining?'☂':'☀';document.getElementById('weatherLabel').textContent=raining?'听雨':'晴天';document.getElementById('weather').setAttribute('aria-pressed',String(raining));document.getElementById('story').textContent=raining?'雨落在屋檐上，今天也不必着急。':'日子很慢，风也很轻。';clock();toast(raining?'下雨啦，面包店还亮着灯。':'雨停了，去河边走走吧。');render();}
function summon(){trainStart=t;toast('下一班，开往不着急的地方。');}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('按 F11，也能进入或退出全屏。');}}
function help(){const p=document.getElementById('helpPanel');p.classList.toggle('open');document.getElementById('help').setAttribute('aria-expanded',String(p.classList.contains('open')));wake();}
document.getElementById('phase').onclick=phase;document.getElementById('weather').onclick=weather;document.getElementById('train').onclick=summon;document.getElementById('fullscreen').onclick=fullscreen;document.getElementById('help').onclick=help;document.getElementById('closeHelp').onclick=help;
document.addEventListener('pointermove',wake,{passive:true});document.addEventListener('pointerdown',wake,{passive:true});document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;wake();if(e.repeat)return;switch(e.key.toLowerCase()){case 'd':phase();break;case 'r':weather();break;case 't':summon();break;case 'f':fullscreen();break;case 'h':help();break;case 's':hidden=!hidden;document.body.classList.toggle('hide-ui',hidden);break;case ' ':e.preventDefault();paused=!paused;document.body.classList.toggle('paused',paused);break;}});
canvas.addEventListener('click',e=>{const scale=Math.max(innerWidth/W,innerHeight/H),x=(e.clientX-(innerWidth-W*scale)/2)/scale,y=(e.clientY-(innerHeight-H*scale)/2)/scale;
 const i=buildings.findIndex(b=>x>=b.x-5&&x<=b.x+b.w+5&&y>=b.y-30&&y<=b.y+b.h);
 if(i>=0){if(manualLights.has(i))manualLights.delete(i);else manualLights.add(i);toast(manualLights.has(i)?'为你留了一盏灯。':'阳光也会照进这扇窗。');render();return;}
 if(y<220||y>595||inWater(x,y)||(y>485&&y<521)){if(inWater(x,y))toast('河水正慢慢流向远方。');return;}
 const col=pick(['#f3cc80','#ecc2a3','#efe0ad','#cbb5d1']);for(let i=0;i<5;i++){flowers.push({x:Math.round(x+rnd(-6,6)),y:Math.round(y+rnd(-4,4)),col});particles.push({x:x+rnd(-8,8),y:y-7,col,born:t});}if(flowers.length>120)flowers.splice(0,flowers.length-120);try{localStorage.setItem('pinewind-flowers',JSON.stringify(flowers));}catch{}toast('种下一点小小的好心情。');render();});
clock();setInterval(clock,1000);render();requestAnimationFrame(frame);
// Small, read-only diagnostics for checking the local build.
window.pinewind={getState:()=>({time:t,paused,phase:phaseMode,raining,residents:villagers.length,flowers:flowers.length,buildings:buildings.length,night,trainAge:t-trainStart})};
})();
