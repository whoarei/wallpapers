name: Sync release to Gitee

on:
  # GITHUB_TOKEN-created releases do not trigger release workflows, so library.yml
  # calls this workflow directly after publishing successfully.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub Release tag (empty = latest stable release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name != 'release' ||
      (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'library-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Gitee credential
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo '::error::Add the GITEE_TOKEN repository Actions secret with Gitee projects permission.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download and verify published GitHub assets
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --json tagName --jq '.tagName')"
          fi
          if [[ ! "$tag" =~ ^library-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Expected a library-vX.Y.Z release tag.'
            exit 1
          fi
          gh release view "$tag" --json tagName,name,body,url,isDraft,isPrerelease > release.json
          jq -e '.isDraft == false and .isPrerelease == false' release.json
          gh release download "$tag" --dir release-assets
          (cd release-assets && sha256sum --strict -c SHA256SUMS.txt)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Copy the release tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          LIBRARY_TAG: ${{ steps.source.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/gitee-askpass.sh" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'xishuaiya' ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/gitee-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/gitee-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git push https://gitee.com/xishuaiya/wallpapers.git "refs/tags/$LIBRARY_TAG:refs/tags/$LIBRARY_TAG"
      - name: Upload and verify Gitee Release attachments
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          LIBRARY_COMMIT: ${{ steps.source.outputs.commit }}
        run: >-
          python scripts/sync_gitee.py --assets release-assets --release release.json
          --source-repository "$GITHUB_REPOSITORY" --target-commit "$LIBRARY_COMMIT"
